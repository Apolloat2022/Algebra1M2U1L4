  {"se": 241, "q": "A table has the points [[(2, 9)]], [[(5, 15)]] and [[(11, 27)]]. Which function does it represent?", "choices": ["[[y = 2x + 5]]", "[[y = 6x − 3]]", "[[y = 2x + 9]]", "It is not linear"], "why": "[[(15 − 9) ÷ (5 − 2) = 2]] and [[(27 − 15) ÷ (11 − 5) = 2]], so the slope is 2. Then [[9 = 2(2) + b]], so [[b = 5]]."},
  {"se": 241, "q": "Selling 4 bracelets earns $10, 10 earn $25, and 16 earn $40. Which is true?", "choices": ["[[y = 2.5x]]; the money is directly proportional to bracelets sold", "[[y = 2.5x + 10]]; not directly proportional", "[[y = 6x]]; directly proportional", "It isn't linear, because the inputs aren't consecutive"], "why": "Every ratio is [[10 ÷ 4 = 25 ÷ 10 = 40 ÷ 16 = 2.5]], so [[y = 2.5x]], which passes through [[(0, 0)]]."},
  {"se": 242, "q": "A fair charges a $5 entrance fee and $1.50 per ride. With $20, how many rides can you go on?", "choices": ["10", "13", "15", "11"], "why": "[[1.5x + 5 = 20]], so [[1.5x = 15]] and [[x = 10]]. 13 forgets the entrance fee."},
  {"se": 244, "q": "Gracie earns [[E(t) = 15t]] dollars for [[t]] T-shirts. What does [[E(6) = 90]] mean?", "choices": ["Selling 6 T-shirts earns $90", "Selling 90 T-shirts earns $6", "She earns $15 for 6 T-shirts", "She needs 6 more shirts to earn $90"], "why": "The input [[t]] is T-shirts and the output [[E(t)]] is dollars, so [[(6, 90)]] means 6 shirts earn $90."},
  {"se": 244, "q": "Gracie earns $15 per T-shirt. How many T-shirts must she sell to earn at least $200?", "choices": ["14", "13", "15", "185"], "why": "[[15t = 200]] gives [[t ≈ 13.3]]. She can't sell part of a shirt, and 13 shirts earn only $195, so she needs 14."},
  {"se": 248, "q": "Which is [[G(t) = 15(t − 3)]] in general form, and what is its [[y]]-intercept?", "choices": ["[[G(t) = 15t − 45]]; [[(0, −45)]]", "[[G(t) = 15t − 3]]; [[(0, −3)]]", "[[G(t) = 15t − 45]]; [[(3, 0)]]", "[[G(t) = 15t + 45]]; [[(0, 45)]]"], "why": "Distribute: [[15t − 45]]. In general form [[f(x) = ax + b]], [[b]] is the [[y]]-intercept. [[(3, 0)]] is the [[x]]-intercept."},
  {"se": 248, "q": "What are the degree and leading coefficient of [[P(x) = −4x² + 7x − 1]]?", "choices": ["degree 2, leading coefficient −4", "degree 2, leading coefficient 7", "degree 1, leading coefficient −4", "degree 3, leading coefficient −1"], "why": "The greatest exponent is 2, and the coefficient on [[x²]] is [[−4]]. Keep the negative sign."},
