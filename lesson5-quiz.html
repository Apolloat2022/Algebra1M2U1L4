<script>
window.MC = { mode: "quiz", questions: [
  {"se": 219, "q": "Which describes how to graph [[y = −3x + 4]]?", "choices": ["Plot [[(0, 4)]], then go down 3 and right 1", "Plot [[(0, −3)]], then go up 4 and right 1", "Plot [[(4, 0)]], then go down 3 and right 1", "Plot [[(0, 4)]], then go up 3 and right 1"], "why": "Start at the [[y]]-intercept [[(0, 4)]]. The slope [[−3 = −3/1]] means down 3, right 1."},
  {"se": 220, "q": "Which line has [[y]]-intercept [[(0, −1)]] and passes through [[(2, 2)]]?", "choices": ["[[y = (3/2)x − 1]]", "[[y = (2/3)x − 1]]", "[[y = (3/2)x + 1]]", "[[y = −(3/2)x − 1]]"], "why": "From [[(0, −1)]] to [[(2, 2)]] is up 3, right 2, so the slope is [[3/2]] and [[b = −1]]."},
  {"se": 222, "q": "A diver is 90 feet below sea level and rises at a constant 15 feet per minute. Let [[x]] be minutes and [[y]] the depth in feet. Which equation models this?", "choices": ["[[y = 15x − 90]]", "[[y = −15x − 90]]", "[[y = −90x + 15]]", "[[y = 15x + 90]]"], "why": "The diver starts at [[−90]] (below sea level) and the depth goes up, so the slope is [[+15]]."},
  {"se": 223, "q": "A club had some money, then sold T-shirts for $8 each. After selling 4 shirts, the club had $60. Let [[x]] be shirts sold and [[y]] the money. Which equation models this?", "choices": ["[[y − 60 = 8(x − 4)]]", "[[y − 4 = 8(x − 60)]]", "[[y + 60 = 8(x + 4)]]", "[[y − 60 = 4(x − 8)]]"], "why": "The rate, $8 per shirt, is the slope. 4 shirts and $60 give the point [[(4, 60)]]."},
  {"se": 224, "q": "To graph [[y + 3 = ½(x − 4)]], which point do you plot first?", "choices": ["[[(4, −3)]]", "[[(−4, 3)]]", "[[(3, −4)]]", "[[(4, 3)]]"], "why": "Write it as [[y − (−3) = ½(x − 4)]]. The point is [[(4, −3)]]; then go up 1, right 2."},
  {"se": 226, "q": "Which equation is written in standard form?", "choices": ["[[3x − 5y = 15]]", "[[y = 3x − 5]]", "[[y − 5 = 3(x − 1)]]", "[[½x + y = 4]]"], "why": "Standard form is [[Ax + By = C]] with integers [[A]], [[B]], [[C]]. [[½x + y = 4]] has a fraction, so it isn't standard form."},
  {"se": 227, "q": "What is the [[x]]-intercept of [[3x + 4y = 24]]?", "choices": ["[[(8, 0)]]", "[[(0, 6)]]", "[[(6, 0)]]", "[[(0, 8)]]"], "why": "Let [[y = 0]]: [[3x = 24]], so [[x = 8]]. [[(0, 6)]] is the [[y]]-intercept."},
  {"se": 228, "q": "What is the slope of [[6x + 3y = 9]]?", "choices": ["[[−2]]", "[[2]]", "[[6]]", "[[−½]]"], "why": "Slope [[= −A/B = −6/3 = −2]]. The coefficient of [[x]] is not the slope in standard form."},
  {"se": 230, "q": "Which equation in standard form passes through [[(1, 3)]] and [[(3, 7)]]?", "choices": ["[[−2x + y = 1]]", "[[2x + y = 1]]", "[[−2x + y = −1]]", "[[x − 2y = 1]]"], "why": "Slope [[= (7 − 3) ÷ (3 − 1) = 2]], so [[y − 3 = 2(x − 1)]], which is [[y = 2x + 1]]. Subtract [[2x]]: [[−2x + y = 1]]."},
  {"se": 231, "q": "What is the [[y]]-intercept of [[y − 2 = 4(x + 1)]]?", "choices": ["[[(0, 6)]]", "[[(0, 2)]]", "[[(−1, 2)]]", "[[(0, −2)]]"], "why": "Distribute: [[y − 2 = 4x + 4]], so [[y = 4x + 6]]. [[(−1, 2)]] is a point on the line, not the [[y]]-intercept."},
] };
