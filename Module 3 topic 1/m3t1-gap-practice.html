<script>
window.MC = { mode: "homework", questions: [
  {"q": "Solve [[x + 14 = 31]].", "choices": ["[[17]]", "[[45]]", "[[27]]", "[[13]]"], "why": "Subtract 14 from both sides: [[x = 31 − 14 = 17]]. 45 adds instead of subtracting."},
  {"q": "Solve [[x + 9 = −4]].", "choices": ["[[−13]]", "[[5]]", "[[13]]", "[[−5]]"], "why": "Subtract 9 from both sides: [[x = −4 − 9 = −13]]. 5 adds 9 instead of subtracting.", "letters": "FGHJ"},
  {"q": "Solve [[2.5x = 10]].", "choices": ["[[4]]", "[[25]]", "[[7.5]]", "[[12.5]]"], "why": "Divide both sides by 2.5: [[x = 10 ÷ 2.5 = 4]]. 25 multiplies instead of dividing."},
  {"q": "Solve [[x/6 = 7]].", "choices": ["[[42]]", "[[13]]", "[[1]]", "[[36]]"], "why": "Multiply both sides by 6: [[x = 7 · 6 = 42]]. 13 adds 6 instead of multiplying.", "letters": "FGHJ"},
  {"q": "Solve [[x + 3.6 = 9.2]].", "choices": ["[[5.6]]", "[[12.8]]", "[[6.6]]", "[[5.4]]"], "why": "Subtract 3.6: [[x = 9.2 − 3.6 = 5.6]]. Line up the decimal points."},
  {"q": "Solve [[x − 4.75 = 2.5]].", "choices": ["[[7.25]]", "[[2.25]]", "[[−2.25]]", "[[4.8]]"], "why": "Add 4.75 to both sides: [[x = 2.5 + 4.75 = 7.25]]. 2.25 subtracts instead of adding.", "letters": "FGHJ"},
  {"q": "Solve [[0.4x = 6]].", "choices": ["[[15]]", "[[2.4]]", "[[1.5]]", "[[5.6]]"], "why": "Divide both sides by 0.4: [[x = 6 ÷ 0.4 = 15]]. 2.4 multiplies instead of dividing."},
  {"q": "Solve [[x + 1/4 = 5/6]].", "choices": ["[[7/12]]", "[[13/12]]", "[[2]]", "[[1/12]]"], "why": "Subtract [[1/4]]. Common denominator 12: [[10/12 − 3/12 = 7/12]]. 2 subtracts tops and bottoms separately.", "letters": "FGHJ"},
  {"q": "Solve [[x + 0.85 = 3.1]].", "choices": ["[[2.25]]", "[[3.95]]", "[[2.35]]", "[[2.75]]"], "why": "Subtract 0.85: [[x = 3.10 − 0.85 = 2.25]]. Write 3.1 as 3.10 to line up the places."},
  {"q": "Solve [[x + 38 = 95]].", "choices": ["[[57]]", "[[133]]", "[[67]]", "[[47]]"], "why": "Subtract 38: [[x = 95 − 38 = 57]].", "letters": "FGHJ"},
  {"q": "Write [[6x + 3y = 12]] in slope-intercept form.", "choices": ["[[y = −2x + 4]]", "[[y = 2x + 4]]", "[[y = −6x + 12]]", "[[y = −2x + 12]]"], "why": "Subtract [[6x]]: [[3y = −6x + 12]]. Divide every term by 3: [[y = −2x + 4]]."},
  {"q": "Write [[5x + 2y = 8]] in slope-intercept form.", "choices": ["[[y = −(5/2)x + 4]]", "[[y = (5/2)x + 4]]", "[[y = −5x + 4]]", "[[y = −(5/2)x + 8]]"], "why": "Subtract [[5x]]: [[2y = −5x + 8]]. Divide every term by 2: [[y = −(5/2)x + 4]].", "letters": "FGHJ"},
  {"q": "Write [[2x − 3y = 7]] in slope-intercept form.", "choices": ["[[y = (2/3)x − 7/3]]", "[[y = −(2/3)x + 7/3]]", "[[y = (2/3)x + 7/3]]", "[[y = 2x − 7]]"], "why": "Subtract [[2x]]: [[−3y = −2x + 7]]. Divide every term by [[−3]]: [[y = (2/3)x − 7/3]]."},
  {"q": "Write [[(1/2)x + (1/3)y = 2]] in slope-intercept form.", "choices": ["[[y = −(3/2)x + 6]]", "[[y = −(1/6)x + 2/3]]", "[[y = (3/2)x + 6]]", "[[y = −(3/2)x + 2]]"], "why": "Subtract [[(1/2)x]]: [[(1/3)y = −(1/2)x + 2]]. Multiply every term by 3: [[y = −(3/2)x + 6]].", "letters": "FGHJ"},
  {"q": "Write [[4x + 2y = −10]] in slope-intercept form.", "choices": ["[[y = −2x − 5]]", "[[y = 2x − 5]]", "[[y = −2x + 5]]", "[[y = −4x − 10]]"], "why": "Subtract [[4x]]: [[2y = −4x − 10]]. Divide every term by 2: [[y = −2x − 5]]."},
  {"q": "Write [[y − 3 = 2(x + 1)]] in slope-intercept form.", "choices": ["[[y = 2x + 5]]", "[[y = 2x + 4]]", "[[y = 2x − 1]]", "[[y = 2x + 1]]"], "why": "Distribute: [[y − 3 = 2x + 2]]. Add 3: [[y = 2x + 5]]. 2x + 4 forgets to multiply the 1.", "letters": "FGHJ"},
  {"q": "Write [[y + 4 = −3(x − 2)]] in slope-intercept form.", "choices": ["[[y = −3x + 2]]", "[[y = −3x + 10]]", "[[y = −3x − 10]]", "[[y = −3x − 2]]"], "why": "Distribute: [[y + 4 = −3x + 6]]. Subtract 4: [[y = −3x + 2]]. 10 adds the 4 instead of subtracting."},
  {"q": "Write [[y − 7 = 4(x − 2)]] in slope-intercept form.", "choices": ["[[y = 4x − 1]]", "[[y = 4x − 15]]", "[[y = 4x + 5]]", "[[y = 4x + 1]]"], "why": "Distribute: [[y − 7 = 4x − 8]]. Add 7: [[y = 4x − 1]]. 4x + 5 forgets to multiply the 2.", "letters": "FGHJ"},
  {"q": "Write [[y − 2 = (1/2)(x − 6)]] in slope-intercept form.", "choices": ["[[y = (1/2)x − 1]]", "[[y = (1/2)x − 4]]", "[[y = (1/2)x − 5]]", "[[y = (1/2)x + 1]]"], "why": "Distribute: [[(1/2)(−6) = −3]], so [[y − 2 = (1/2)x − 3]]. Add 2: [[y = (1/2)x − 1]]."},
  {"q": "Write [[y + 1 = −(2/3)(x + 9)]] in slope-intercept form.", "choices": ["[[y = −(2/3)x − 7]]", "[[y = −(2/3)x − 5]]", "[[y = −(2/3)x − 10]]", "[[y = (2/3)x − 7]]"], "why": "Distribute: [[−(2/3)(9) = −6]], so [[y + 1 = −(2/3)x − 6]]. Subtract 1: [[y = −(2/3)x − 7]].", "letters": "FGHJ"},
] };
