  {"q": "Jayden has $40 in his bank account. He deposits $15 each week to save for new headphones. Which equation can be used to determine the amount that Jayden has saved, <i>y</i>, after <i>x</i> weeks?", "choices": ["<i>y</i> = 15<i>x</i> + 40", "<i>y</i> = 15 + 40<i>x</i>", "<i>y</i> = −15<i>x</i> + 40", "<i>y</i> = −40<i>x</i> + 15"], "why": "$15 per week is the rate (multiplies x); the $40 he starts with is the constant."},
  {"q": "What value of <i>k</i> makes the equation 5 − 4(<i>k</i> + 3) = 9 − 2(2<i>k</i> + 6) true?", "choices": ["No solution", "1", "2", "4"], "why": "Left: 5 − 4k − 12 = −4k − 7. Right: 9 − 4k − 12 = −4k − 3. Same k-term, different constants → no solution.", "letters": "FGHJ"},
  {"q": "What is the solution set for 3(4 − <i>t</i>) > −2<i>t</i> + 15?", "choices": ["<i>t</i> &lt; −3", "<i>t</i> &gt; −3", "<i>t</i> &lt; 3", "<i>t</i> ≥ 3"], "why": "12 − 3t > −2t + 15 → −t > 3 → divide by −1 and flip: t < −3."},
  {"q": "Solve the equation shown.<br>0.3(4<i>x</i> − 6) = −1.8<i>x</i> + 4.2", "choices": ["<i>x</i> = 2", "<i>x</i> = 0.8", "<i>x</i> = −2", "<i>x</i> = 4"], "why": "1.2x − 1.8 = −1.8x + 4.2 → 3x = 6 → x = 2. Check: 0.3(2) = 0.6 and −3.6 + 4.2 = 0.6 ✓", "letters": "FGHJ"},
  {"q": "Does the equation shown below have one solution, no solution, or an infinite number of solutions? Explain your reasoning.<br>1/3(12<i>x</i> + 30) = 4(<i>x</i> + 2) + 2", "choices": ["Infinite solutions", "One solution", "No solution", "<i>x</i> = 10"], "why": "Left: 4x + 10. Right: 4x + 8 + 2 = 4x + 10. The sides are identical, so every x works."},
  {"q": "Maya goes to a school store. She buys 4 notebooks that cost $1.75 each and some pens for $1.20 each. Write an equation for the total cost, <i>y</i>, when Maya buys <i>x</i> pens.", "choices": ["<i>y</i> = 1.20<i>x</i> + 7.00", "<i>y</i> = 1.75<i>x</i> + 4.80", "<i>y</i> = 4<i>x</i> + 1.20", "<i>y</i> = 7<i>x</i> + 1.20"], "why": "Notebooks are a fixed $7.00 (4 × 1.75). Pens change: $1.20 per pen → y = 1.20x + 7.00.", "letters": "FGHJ"},
  {"q": "Rewrite the equation in slope-intercept form.<br>2<i>x</i> + 5<i>y</i> = 15", "choices": ["<i>y</i> = −2/5 <i>x</i> + 3", "<i>y</i> = 2/5 <i>x</i> + 3", "<i>y</i> = −2<i>x</i> + 15", "<i>y</i> = −5/2 <i>x</i> + 15/2"], "why": "5y = −2x + 15 → divide every term by 5: y = −2/5 x + 3."},
  {"q": "The formula for the volume of a rectangular prism is <i>V</i> = <i>ℓwh</i>. Solve the equation for <i>h</i>.", "choices": ["<i>h</i> = V/(ℓw)", "<i>h</i> = Vℓw", "<i>h</i> = V − ℓw", "<i>h</i> = ℓw/V"], "why": "h is multiplied by ℓw, so divide both sides by ℓw.", "letters": "FGHJ"},
  {"q": "Solve the inequality, and graph the solution on the number line.<br>2.5<i>m</i> − 3 < −1.5(<i>m</i> + 18)", "choices": ["<i>m</i> &lt; −6", "<i>m</i> &gt; −6", "<i>m</i> &lt; 6", "<i>m</i> ≤ −6"], "why": "2.5m − 3 < −1.5m − 27 → add 1.5m and 3: 4m < −24 → m < −6. Open circle at −6, shade left."},
  {"q": "Rewrite the equation <i>y</i> − 4 = 3(<i>x</i> + 2) in slope-intercept form.", "choices": ["<i>y</i> = 3<i>x</i> + 10", "<i>y</i> = 3<i>x</i> + 6", "<i>y</i> = 3<i>x</i> − 2", "<i>y</i> = 3<i>x</i> + 2"], "why": "y − 4 = 3x + 6 → add 4: y = 3x + 10.", "letters": "FGHJ"},
  {"q": "A triangle has a height of (3<i>n</i> − 6) inches and a base of 10 inches. A rectangle has a length of 5 inches and a width of (<i>n</i> + 4) inches. The area of the triangle is equal to the area of the rectangle. What is the value of <i>n</i>?", "choices": ["<i>n</i> = 5", "<i>n</i> = 1", "<i>n</i> = 2.5", "<i>n</i> = 13"], "why": "½(10)(3n − 6) = 5(n + 4) → 15n − 30 = 5n + 20 → 10n = 50 → n = 5. Check: both areas are 45 in²."},
  {"q": "Which equation has <b>no solution</b>?", "choices": ["3(<i>x</i> − 2) = 3<i>x</i> + 5", "3(<i>x</i> − 2) = 3<i>x</i> − 6", "3(<i>x</i> − 2) = 2<i>x</i> + 5", "3<i>x</i> − 2 = 2<i>x</i> − 3"], "why": "3x − 6 = 3x + 5: same x-term, different constants. (G is infinite; H and J have one solution.)", "letters": "FGHJ"},
  {"q": "What is the solution set for −4<i>x</i> + 7 ≥ 19?", "choices": ["<i>x</i> ≤ −3", "<i>x</i> ≥ −3", "<i>x</i> ≤ 3", "<i>x</i> ≥ −6.5"], "why": "−4x ≥ 12 → divide by −4 and flip: x ≤ −3."},
  {"q": "The perimeter of a rectangle is <i>P</i> = 2<i>ℓ</i> + 2<i>w</i>. Solve for <i>w</i>.", "choices": ["w = (P − 2ℓ)/2", "w = P − 2ℓ", "w = (P + 2ℓ)/2", "w = P/2 − 2ℓ"], "why": "Subtract 2ℓ from both sides, then divide by 2: w = (P − 2ℓ)/2 (or w = P/2 − ℓ).", "letters": "FGHJ"},
  {"q": "A gym charges a $25 sign-up fee plus $8 per class. Lena can spend at most $90. Write and solve an inequality for the number of classes, <i>c</i>, she can take.", "choices": ["At most 8 classes", "At least 8 classes", "At most 11 classes", "At most 14 classes"], "why": "25 + 8c ≤ 90 → 8c ≤ 65 → c ≤ 8.125. Classes are whole numbers, so 8."},
] };
