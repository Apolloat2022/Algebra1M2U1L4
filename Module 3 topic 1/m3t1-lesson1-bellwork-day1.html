<script>
window.MC = { mode: "quiz", questions: [
  {"q": "Marcus has $35 and saves $15 per week. Which equation gives the amount he has saved, [[y]], after [[x]] weeks?", "choices": ["[[y = 15x + 35]]", "[[y = 35x + 15]]", "[[y = −15x + 35]]", "[[y = 50x]]"], "why": "Start at $35 ([[b]]) and add $15 each week ([[m]]): [[y = 15x + 35]]. Like test Q1."},
  {"q": "What value of [[x]] makes [[3(x − 2) = 12]] true?", "choices": ["[[6]]", "[[4⅔]]", "[[2]]", "[[10]]"], "why": "Distribute: [[3x − 6 = 12]], so [[3x = 18]] and [[x = 6]]. 4⅔ forgets to multiply the 2.", "letters": "FGHJ"},
  {"q": "Is [[x = 2]] a solution of [[5x − 1 = 9]]?", "choices": ["Yes, because [[9 = 9]]", "No, because [[10 ≠ 9]]", "Yes, because [[x = 9]]", "No, because [[11 ≠ 9]]"], "why": "Substitute: [[5(2) − 1 = 10 − 1 = 9]]. A true statement means 2 is a solution."},
  {"q": "Which expression is equivalent to [[4(x + 2) − x]]?", "choices": ["[[3x + 8]]", "[[3x + 2]]", "[[5x + 8]]", "[[4x + 6]]"], "why": "Distribute: [[4x + 8 − x = 3x + 8]].", "letters": "FGHJ"},
] };
