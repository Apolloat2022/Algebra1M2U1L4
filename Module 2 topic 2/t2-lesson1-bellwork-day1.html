<script>
window.MC = { mode: "quiz", questions: [
  {"q": "What is the slope between [[(1, 2)]] and [[(4, 11)]]?", "choices": ["[[3]]", "[[⅓]]", "[[9]]", "[[−3]]"], "why": "Slope [[= (11 − 2) ÷ (4 − 1) = 9 ÷ 3 = 3]]."},
  {"q": "What is the [[y]]-intercept of [[y = 3x − 7]]?", "choices": ["[[(0, −7)]]", "[[(0, 3)]]", "[[(−7, 0)]]", "[[(7, 0)]]"], "why": "In [[y = mx + b]], the [[y]]-intercept is [[(0, b)]], so it is [[(0, −7)]]."},
  {"q": "[[f(x) = 2x + 1]]. What is [[f(−3)]]?", "choices": ["[[−5]]", "[[−7]]", "[[7]]", "[[−6]]"], "why": "[[2(−3) + 1 = −6 + 1 = −5]]."},
  {"q": "Which line is parallel to [[y = 3x + 1]]?", "choices": ["[[y = 3x − 5]]", "[[y = −3x + 1]]", "[[y = ⅓x + 1]]", "[[y = x + 3]]"], "why": "Parallel lines have the same slope. Only [[y = 3x − 5]] has slope 3."},
] };
