<script>
window.MC = { mode: "homework", questions: [
  {"q": "The graph of linear function [[m]] passes through (−4, 6) and (2, −3). Given [[f(x) = x]] and [[m(x) = af(x)]], what is the value of [[a]]?", "choices": ["−3/2", "−2/3", "3/2", "2/3"], "why": "a is the slope: (−3 − 6) ÷ (2 − (−4)) = −9/6 = −3/2."},
  {"q": "A food truck rents for $120 plus $45 per hour, for at most 6 hours. What is the range for one rental?", "choices": ["120 ≤ y ≤ 390", "0 ≤ x ≤ 6", "45 ≤ y ≤ 390", "120 ≤ y ≤ 270"], "why": "Range = costs. 0 hours: $120. 6 hours: 120 + 45(6) = $390.", "letters": "FGHJ"},
  {"q": "A vertical line passes through (8, −3). What are its equation and slope?", "choices": ["x = 8; slope is undefined", "y = −3; slope is zero", "x = 8; slope is zero", "y = 8; slope is undefined"], "why": "Vertical: every point has x = 8. Slope = rise ÷ 0: undefined (VUX)."},
  {"q": "Lena graphed [[f(x)]] and [[g(x) = f(x + 4)]]. Which statement describes how the graphs are related?", "choices": ["translated left 4 units", "translated right 4 units", "translated up 4 units", "translated down 4 units"], "why": "Inside the parentheses the graph moves opposite the sign: + 4 → left 4.", "letters": "FGHJ"},
  {"q": "[[f(x)]] has the table (−1, 8), (0, 5), (1, 2), (2, −1). The graph is translated 3 units left. What is the y-intercept of the new function?", "choices": ["−4", "5", "14", "−1"], "why": "f(x) = −3x + 5. Left 3: g(x) = f(x + 3) = −3x − 4. Check: the point at x = 3, (3, −4), moves to (0, −4)."},
  {"q": "[[f(x) = x]] and [[g(x) = f(½x)]]. Write the equation for [[g(x)]].", "choices": ["g(x) = ½x", "g(x) = 2x", "g(x) = x + ½", "g(x) = x − 2"], "why": "Put ½x in for x: g(x) = ½x, a less steep line through (0, 0).", "letters": "FGHJ"},
  {"q": "Write the equation in slope-intercept form of the line that crosses the x-axis at 8 and is perpendicular to [[y = 4x + 1]].", "choices": ["y = −1/4x + 2", "y = −1/4x − 2", "y = 4x − 32", "y = 1/4x − 2"], "why": "Slope −1/4. Point (8, 0): 0 = −1/4(8) + b → b = 2."},
  {"q": "Write the equation in slope-intercept form of the line through (−6, 0) that is parallel to [[y = 1.5x − 4]].", "choices": ["y = 1.5x + 9", "y = 1.5x − 9", "y = −1.5x − 9", "y = 1.5x − 4"], "why": "Same slope 1.5. 0 = 1.5(−6) + b → b = 9.", "letters": "FGHJ"},
  {"q": "A line passes through (1, −2) and (4, 7). Write an equation of the line in point-slope form.", "choices": ["y − 7 = 3(x − 4)", "y + 7 = 3(x + 4)", "y − 7 = 3(x + 4)", "y − 7 = ⅓(x − 4)"], "why": "Slope = (7 − (−2)) ÷ (4 − 1) = 9 ÷ 3 = 3. With (4, 7): y − 7 = 3(x − 4)."},
  {"q": "A line passes through (0, 6) and (3, 0). Which statement is true?", "choices": ["It is decreasing and its zero is 3.", "It is decreasing and its zero is 6.", "It is increasing and its zero is 3.", "Its slope is −1/2 and its zero is 3."], "why": "It falls left to right (slope −6/3 = −2). It crosses the x-axis at 3. The y-intercept is 6.", "letters": "FGHJ"},
  {"q": "Which pair of equations represents perpendicular lines?", "choices": ["y = 2/3x − 1 and y = −3/2x + 4", "y = 2/3x + 1 and y = 2/3x − 4", "y = 2/3x and y = 3/2x + 2", "y = −2/3x + 1 and y = −3/2x"], "why": "2/3 × (−3/2) = −1. (The second pair is parallel.)"},
  {"q": "A phone is at 80% battery and loses 4% per hour until it is empty. What is the domain?", "choices": ["0 ≤ x ≤ 20", "0 ≤ x ≤ 80", "0 ≤ y ≤ 80", "4 ≤ x ≤ 80"], "why": "Domain = hours. 80 ÷ 4 = 20 hours.", "letters": "FGHJ"},
] };
</script>
