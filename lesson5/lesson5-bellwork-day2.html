<script>
window.MC = { mode: "quiz", questions: [
  {"se": 220, "q": "Which three points are on the line [[y = −⅓x + 4]]?", "choices": ["[[(0, 4)]], [[(3, 3)]], [[(−3, 5)]]", "[[(0, 4)]], [[(1, 3)]], [[(−1, 5)]]", "[[(4, 0)]], [[(3, 3)]], [[(−3, 5)]]", "[[(0, 4)]], [[(3, 5)]], [[(−3, 3)]]"], "why": "Start at the [[y]]-intercept [[(0, 4)]]. The slope [[−⅓]] means down 1, right 3 to [[(3, 3)]], or up 1, left 3 to [[(−3, 5)]]."},
  {"se": 221, "q": "Lena has $25 and saves $5 a week. Let [[x]] be the weeks and [[y]] her total savings. Which equation models this?", "choices": ["[[y = 5x + 25]]", "[[y = 25x + 5]]", "[[y = 5x − 25]]", "[[y = 30x]]"], "why": "The rate, $5 per week, is the slope. The starting amount, $25, is the [[y]]-intercept."},
  {"se": 204, "q": "What are the slope and a point on [[y + 2 = 4(x − 1)]]?", "choices": ["[[m = 4]], [[(1, −2)]]", "[[m = 4]], [[(−1, 2)]]", "[[m = −4]], [[(1, −2)]]", "[[m = 2]], [[(1, 4)]]"], "why": "Write it as [[y − (−2) = 4(x − 1)]]. So [[m = 4]] and the point is [[(1, −2)]]."},
  {"se": 227, "q": "Where does the line [[y = 2x − 6]] cross the [[x]]-axis?", "choices": ["[[(3, 0)]]", "[[(0, −6)]]", "[[(−3, 0)]]", "[[(6, 0)]]"], "why": "On the [[x]]-axis, [[y = 0]]. Solve [[0 = 2x − 6]]: [[x = 3]]. [[(0, −6)]] is where it crosses the [[y]]-axis."},
] };
</script>
