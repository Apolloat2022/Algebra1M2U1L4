<div class="wrap">
  <p class="eyebrow">Module 2 · Topic 1 · Lesson 4 · Day 1 Bell Work</p>
  <h1>Bell Work: Review</h1>
  <p class="muted">Warm up while attendance is taken. Answer all 4 questions, then submit to see which ones you got right.</p>
  <label class="name">Your name <input id="name" autocomplete="name"></label>
  <ol id="questions"></ol>
  <div class="bar">
    <button id="submit" disabled>Submit</button>
    <button id="reset" class="ghost">Start over</button>
  </div>
  <p id="result" class="card" style="margin-top:16px" hidden></p>
</div>
<script>
window.MC = { mode: "quiz", questions: [
  { q: "What is the slope of the line through [[(1, 3)]] and [[(4, 9)]]?",
    choices: ["[[2]]", "[[½]]", "[[6]]", "[[3]]"],
    why: "Slope [[= (9 − 3) ÷ (4 − 1) = 6 ÷ 3 = 2]]. Rise over run: the change in [[y]] goes on top." },
  { q: "What are the slope and [[y]]-intercept of [[y = −3x + 5]]?",
    choices: ["slope [[−3]], [[y]]-intercept [[(0, 5)]]", "slope [[5]], [[y]]-intercept [[(0, −3)]]", "slope [[3]], [[y]]-intercept [[(0, 5)]]", "slope [[−3]], [[y]]-intercept [[(5, 0)]]"],
    why: "In [[y = mx + b]], [[m]] is the slope and [[b]] is the [[y]]-intercept, so [[m = −3]] and the line crosses the [[y]]-axis at [[(0, 5)]]." },
  { q: "Which equation has slope 4 and [[y]]-intercept [[(0, −2)]]?",
    choices: ["[[y = 4x − 2]]", "[[y = −2x + 4]]", "[[y = 4x + 2]]", "[[y = 2x − 4]]"],
    why: "Put [[m = 4]] and [[b = −2]] into [[y = mx + b]]: [[y = 4x − 2]]." },
  { q: "Distribute: [[−2(x + 3)]]",
    choices: ["[[−2x − 6]]", "[[−2x + 6]]", "[[−2x + 3]]", "[[2x − 6]]"],
    why: "Multiply both terms by [[−2]]: [[−2 · x = −2x]] and [[−2 · 3 = −6]]." },
] };
</script>
