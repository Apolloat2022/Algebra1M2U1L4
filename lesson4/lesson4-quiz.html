<div class="wrap">
  <p class="eyebrow">Module 2 · Topic 1 · Lesson 4 · Quiz</p>
  <h1>Point-Slope Form Quiz</h1>
  <p class="muted">Answer all 10 questions, then submit. You'll see your score and the correct answers after you submit.</p>
  <label class="name">Your name <input id="name" autocomplete="name"></label>
  <ol id="questions"></ol>
  <div class="bar">
    <button id="submit" disabled>Submit quiz</button>
    <button id="reset" class="ghost">Start over</button>
  </div>
  <p id="result" class="card" style="margin-top:16px" hidden></p>
</div>
<script>
window.MC = { mode: "quiz", questions: [
  { se: 204, q: "Which equation in point-slope form has slope [[m = −3]] and passes through [[(2, 7)]]?",
    choices: ["[[y − 7 = −3(x − 2)]]", "[[y + 7 = −3(x + 2)]]", "[[y − 2 = −3(x − 7)]]", "[[y − 7 = 3(x − 2)]]"],
    why: "Substitute [[m = −3]], [[x₁ = 2]] and [[y₁ = 7]] into [[y − y₁ = m(x − x₁)]]." },
  { se: 216, q: "A line passes through [[(2, 2)]] and [[(4, 14)]]. Which is its equation in point-slope form?",
    choices: ["[[y − 2 = 6(x − 2)]]", "[[y − 2 = ⅙(x − 2)]]", "[[y − 14 = 6(x − 2)]]", "[[y − 2 = 12(x − 2)]]"],
    why: "Slope [[= (14 − 2) ÷ (4 − 2) = 12 ÷ 2 = 6]]. Using [[(2, 2)]] gives [[y − 2 = 6(x − 2)]]. Both numbers in the equation must come from the same point." },
  { se: 204, q: "What is the slope of the line through [[(−4, 1)]] and [[(2, −11)]]?",
    choices: ["[[−2]]", "[[2]]", "[[−½]]", "[[−5/3]]"],
    why: "Slope [[= (−11 − 1) ÷ (2 − (−4)) = −12 ÷ 6 = −2]]." },
  { se: 203, q: "Rewrite [[y − 1 = 4(x + 3)]] in slope-intercept form.",
    choices: ["[[y = 4x + 13]]", "[[y = 4x + 11]]", "[[y = 4x + 4]]", "[[y = 4x + 3]]"],
    why: "Distribute: [[y − 1 = 4x + 12]]. Add 1 to both sides: [[y = 4x + 13]]." },
  { se: 203, q: "Which point is on the line [[y + 2 = 5(x − 1)]]?",
    choices: ["[[(1, −2)]]", "[[(−1, 2)]]", "[[(1, 2)]]", "[[(5, −2)]]"],
    why: "Write it as [[y − (−2) = 5(x − 1)]]. The point is [[(x₁, y₁) = (1, −2)]]. Check: [[−2 + 2 = 5(1 − 1)]] gives [[0 = 0]]." },
  { se: 215, q: "Lucia is taking the stairs at a steady pace. After 2 minutes, she was 100 steps from the bottom floor. After 5 minutes, she was 196 steps from the bottom floor. Let [[x]] be the minutes and [[y]] the steps. Which equation models this?",
    choices: ["[[y − 100 = 32(x − 2)]]", "[[y − 2 = 32(x − 100)]]", "[[y − 100 = 96(x − 2)]]", "[[y − 100 = 48(x − 2)]]"],
    why: "The points are [[(2, 100)]] and [[(5, 196)]]. Slope [[= (196 − 100) ÷ (5 − 2) = 96 ÷ 3 = 32]] steps per minute. Then use [[(2, 100)]]." },
  { se: 206, q: "Which equation is the horizontal line through [[(−4, 9)]]?",
    choices: ["[[y = 9]]", "[[x = −4]]", "[[y = −4]]", "[[x = 9]]"],
    why: "A horizontal line keeps the same [[y]]-value, so it is [[y = 9]]." },
  { se: 207, q: "Which equation is the vertical line through [[(−4, 9)]]?",
    choices: ["[[x = −4]]", "[[y = 9]]", "[[x = 9]]", "[[y = −4]]"],
    why: "A vertical line keeps the same [[x]]-value, so it is [[x = −4]]." },
  { se: 207, q: "Which describes the graph of [[y = −1]]?",
    choices: ["a horizontal line with slope 0", "a vertical line with undefined slope", "a horizontal line with undefined slope", "a vertical line with slope 0"],
    why: "[[y =]] a number is a horizontal line, and a horizontal line has slope 0 (HOY: Horizontal, zerO slope, [[y =]] a number)." },
  { se: 203, q: "Which equation does NOT describe the same line as [[y = 2x + 1]]?",
    choices: ["[[y − 5 = 2(x − 1)]]", "[[y − 3 = 2(x − 1)]]", "[[y − 7 = 2(x − 3)]]", "[[y + 1 = 2(x + 1)]]"],
    why: "Each equation names a point on its line. [[(1, 3)]], [[(3, 7)]] and [[(−1, −1)]] are all on [[y = 2x + 1]], but [[(1, 5)]] is not: [[2(1) + 1 = 3]], not 5." },
] };
</script>
